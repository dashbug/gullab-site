- title: "Loss of GABARAP mediates resistance to immunogenic chemotherapy in multiple myeloma"
  image: img.png
  description: Why do patients continue to relapse from multiple myeloma despite presence of competent immune cells in the microenvironment? We investigated this paradoxical phenomenon and found that deletion of the protein GABARAP altered the ability of myeloma cells to induce anti-tumor immune responses.
  authors: Annamaria Gulla, Eugenio Morelli, Megan Johnstone, Marcello Turi, Mehmet K Samur, Cirino Botta, Selma Cifric, Pietro Folino, Delaney Vinaixa, Francesca Barello, Cole Clericuzio, Vanessa Katia Favasuli, Domenico Maisano, Srikanth Talluri, Rao Prabhala, Giada Bianchi, Mariateresa Fulciniti, Kenneth Wen, Keiji Kurata, Jiye Liu, Johany Penailillo, Alberto Bragoni, Anna Sapino, Paul G Richardson, Dharminder Chauhan, Ruben D Carrasco, Teru Hideshima, Nikhil C Munshi, Kenneth C Anderson
